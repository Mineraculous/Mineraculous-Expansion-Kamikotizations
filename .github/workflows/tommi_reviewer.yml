name: T.O.M.M.I. AI Code Reviewer

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request:
    types: [closed]

jobs:
  tommi:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: Mineraculous/.github/.github/workflows/tommi_reviewer.yml@main
    secrets: inherit
