name: publish

on:
  workflow_dispatch:
    inputs:
      title:
        description: "title"
        required: true
        type: string
      last_version:
        description: "previous mod version"
        required: true
        type: string
      version:
        description: "new mod version"
        required: true
        type: string
      game_versions:
        description: "the minecraft versions it supports"
        required: true
        type: string

jobs:
  publish:
    uses: Mineraculous/.github/.github/workflows/publish.yml@main
    secrets: inherit
    with:
      title: ${{ inputs.title }}
      last_version: ${{ inputs.last_version }}
      version: ${{ inputs.version }}
      game_versions: ${{ inputs.game_versions }}
      artifact-name: 'Mineraculous Expansion Kamikotizations'
      modrinth-id: 'mineraculouskamikotizations'
      curseforge-id: '1649852'
