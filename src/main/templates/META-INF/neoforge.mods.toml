modLoader="javafml"
loaderVersion="[${major_fml_version},)"
license="${license}"
issueTrackerURL="https://github.com/thomasglasser/${github_name}/issues"
[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
updateJSONURL = "https://api.modrinth.com/updates/${mod_id}/forge_updates.json?neoforge=include"
displayURL="https://github.com/thomasglasser/${github_name}/wiki"
logoFile="${icon}"
authors="${mod_author}"
description='''
${description}
'''
[[mixins]]
config = "${mod_id}.mixins.json"
[mc-publish]
loaders = ['neoforge']
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Required Dependencies
[[dependencies.${mod_id}]]
modId="tommylib"
type="required"
versionRange="${tommylib_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="mineraculous"
type="required"
versionRange="${mineraculous_version_range}"
ordering="AFTER"
side="BOTH"
