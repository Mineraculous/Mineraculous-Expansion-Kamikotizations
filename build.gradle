import java.util.regex.Matcher
import java.util.regex.Pattern

plugins {
	id 'java-library'
	id 'maven-publish'
	id 'signing'
	id 'dev.lukebemish.immaculate' version '0.1.+'
	id 'idea'
	id 'net.neoforged.moddev' version "${mdg_version}"
}

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

base {
	archivesName = "${mod_id}-${minecraft_version}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version)
	withSourcesJar()
	withJavadocJar()
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroupAndSubgroups "maven.modrinth" }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'JEI'
				url = 'https://maven.blamejared.com/'
			}
		}
		filter { includeGroupAndSubgroups "mezz.jei" }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'GeckoLib'
				url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
			}
		}
		filter {
			includeGroupAndSubgroups 'software.bernie.geckolib'
			includeGroupAndSubgroups 'com.eliotlash.mclib'
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'SmartBrainLib'
				url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/"
			}
		}
		filter { includeGroupAndSubgroups 'net.tslat.smartbrainlib' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Curios'
				url = "https://maven.theillusivec4.top/"
			}
		}
		filter { includeGroupAndSubgroups 'top.theillusivec4.curios' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modonomicon'
				url = "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
			}
		}
		filter { includeGroupAndSubgroups "com.klikli_dev" }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Voice Chat API'
				url = 'https://maven.maxhenkel.de/repository/public'
			}
		}
		filter { includeGroupAndSubgroups "de.maxhenkel.voicechat" }
	}
	maven {
		name = 'TommyLib, Sherds API, and Mineraculous'
		url = 'https://maven.thomasglasser.dev/releases'
		content {
			includeGroupAndSubgroups("dev.thomasglasser.tommylib")
			includeGroupAndSubgroups("dev.thomasglasser.sherdsapi")
			includeGroupAndSubgroups("dev.thomasglasser.mineraculous")
		}
	}
	maven {
		name = 'Mineraculous Betas'
		url = 'https://maven.thomasglasser.dev/betas'
		credentials {
			username = project.findProperty("MINERACULOUS_USERNAME") ?: System.getenv("MINERACULOUS_USERNAME")
			password = project.findProperty("MINERACULOUS_PASSWORD") ?: System.getenv("MINERACULOUS_PASSWORD")
		}
		content {
			includeGroupAndSubgroups("dev.thomasglasser.mineraculous")
		}
	}
	maven {
		name = 'NeoForge'
		url = 'https://maven.neoforged.net/releases'
	}
	maven {
		name = 'Mojang Meta'
		url = 'https://maven.neoforged.net/mojang-meta'
	}
	mavenCentral()
	mavenLocal()
}

neoForge {
	version = "${neoforge_version}"

	parchment {
		minecraftVersion = parchment_minecraft_version
		mappingsVersion = parchment_version
	}

	runs {
		configureEach {
			systemProperties.put('terminal.ansi', 'true')
		}
		client {
			client()
			ideName = "Client"
			gameDirectory = project.layout.projectDirectory.dir('runs/client')
		}
		client_alt {
			client()
			ideName = "Client 2"
			gameDirectory = project.layout.projectDirectory.dir('runs/client_alt')
			programArguments.addAll "--username", "DevAlt"
		}
		client_alt_alt {
			client()
			ideName = "Client 3"
			gameDirectory = project.layout.projectDirectory.dir('runs/client_alt_alt')
			programArguments.addAll "--username", "DevAltAlt"
		}
		auth_client {
			client()
			ideName = "Auth Client"
			devLogin = true
			gameDirectory = project.layout.projectDirectory.dir('runs/auth_client')
		}
		server {
			server()
			ideName = "Server"
			gameDirectory = project.layout.projectDirectory.dir('runs/server')
		}
		data {
			data()
			ideName = "Data Generation"
			gameDirectory = project.layout.projectDirectory.dir('runs/data')
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}
	}

	mods {
		mineraculouskamikotizations {
			sourceSet sourceSets.main
		}
	}
}

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	jarJar implementation("dev.thomasglasser.tommylib:tommylib-neoforge-${minecraft_version}:${tommylib_version}")

    api "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // api "dev.thomasglasser.mineraculous:mineraculous-${minecraft_version}:${mineraculous_version}"
    api "dev.thomasglasser.mineraculous.${project.findProperty("MINERACULOUS_USERNAME") ?: System.getenv("MINERACULOUS_USERNAME")}:mineraculous-${minecraft_version}:${mineraculous_version}"

	implementation "maven.modrinth:jade:${jade_version}+neoforge"
    implementation "com.klikli_dev:modonomicon-${minecraft_version}-neoforge:${modonomicon_version}"

    // Runtime
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			version: project.version,
			group: project.group,
			minecraft_version: minecraft_version,
			next_minecraft_version: next_minecraft_version,
			mod_name: mod_name,
			mod_author: mod_author,
			mod_id: mod_id,
			license: license,
			description: project.description,
			neoforge_version: neoforge_version,
			major_fml_version: major_fml_version,
			java_version: java_version,
			icon: icon,
			github_name: github_name,
			tommylib_version: tommylib_version,
			mineraculous_version: mineraculous_version
	]

	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
tasks.processResources.dependsOn generateModMetadata

def generatePackageInfos = tasks.register('generatePackageInfos') {
	File srcDir = file('src/main/java')
	File outDir = layout.buildDirectory.dir("generated/sources/packageInfo/main/java").get().asFile
	inputs.dir(srcDir)
	outputs.dir(outDir)
	doLast {
		srcDir.eachFileRecurse { file ->
			if (file.isDirectory()) {
				def javaFiles = file.listFiles({ f -> f.name.endsWith('.java') } as FileFilter)
				if (javaFiles != null && javaFiles.length > 0) {
					String relPath = srcDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
					String pkgName = relPath.replace('/', '.')
					File pkgInfo = new File(outDir, relPath + '/package-info.java')
					pkgInfo.parentFile.mkdirs()
					pkgInfo.text = """@ParametersAreNonnullByDefault
@MethodsReturnNonnullByDefault
package ${pkgName};

import javax.annotation.ParametersAreNonnullByDefault;
import net.minecraft.MethodsReturnNonnullByDefault;
"""
				}
			}
		}
	}
}

sourceSets.main.java.srcDir generatePackageInfos

sourceSets.main.resources { srcDir 'src/generated/resources' }

compileJava.dependsOn immaculateApply
compileJava.finalizedBy immaculateCheck

immaculate {
	workflows.register('java') {
		java()
		files.from rootProject.fileTree("src", {
			include "**/*.java"
		})
		noTabs()
		googleFixImports()
		toggleOff = 'spotless:off'
		toggleOn = 'spotless:on'
		eclipse {
			version '3.37.0'
			config = rootProject.file('codeformat/formatter-config.xml')
		}

		// courtesy of diffplug/spotless#240
		// https://github.com/diffplug/spotless/issues/240#issuecomment-385206606
		custom 'noWildcardImports', { String fileContents ->
			if (fileContents.contains('*;\n')) {
				throw new GradleException('No wildcard imports are allowed!')
			}
		}

		custom 'noNotNull', { String fileContents ->
			if (fileContents.contains('@NotNull') || fileContents.contains('@Nonnull')) {
				throw new GradleException('@NotNull and @Nonnull are disallowed.')
			}
		}

		//Trim any trailing whitespace from patch additions
		def trailingWhitespace = Pattern.compile('^\\+.*[ \t]+\$', Pattern.UNIX_LINES | Pattern.MULTILINE)
		custom 'trimTrailingWhitespace', { String fileContents ->
			Matcher matcher = trailingWhitespace.matcher(fileContents)
			StringBuilder sb = new StringBuilder()
			while (matcher.find()) {
				matcher.appendReplacement(sb, matcher.group().trim())
			}
			matcher.appendTail(sb)
			return sb.toString()
		}

		custom 'jetbrainsNullable', { String fileContents ->
			fileContents.replace('javax.annotation.Nullable', 'org.jetbrains.annotations.Nullable')
		}
	}
}

javadoc {
	failOnError = false
	options {
		tags = [
				'apiNote:a:API Note:'
		]
	}
}

def getBetaTesters() {
	def testers = []
	try {
		def gistUrl = new URL('https://gist.githubusercontent.com/thomasglasser/aa8eb933847685b93d8f99a59f07b62e/raw/mineraculous_special_players.txt')
		gistUrl.eachLine { line ->
			if (!line.startsWith("//") && line.contains("beta")) {
				def parts = line.split("\\|")
				if (parts.length > 0) {
					testers.add(parts[0].trim())
				}
			}
		}
	} catch (Exception e) {
		println "WARNING: Failed to fetch beta testers from Gist: ${e.message}"
	}
	return testers
}

def getBetaTesterUuid(String name) {
	try {
		def gistUrl = new URL('https://gist.githubusercontent.com/thomasglasser/aa8eb933847685b93d8f99a59f07b62e/raw/mineraculous_special_players.txt')
		for (String line : gistUrl.readLines()) {
			if (!line.startsWith("//") && line.contains("beta")) {
				def parts = line.split("\\|")
				if (parts.length > 1 && parts[0].trim().equals(name)) {
					return parts[1].trim()
				}
			}
		}
	} catch (Exception e) {
		println "WARNING: Failed to fetch beta tester UUID for ${name}: ${e.message}"
	}
	return ""
}

def registerBetaJar(String testerName) {
	String testerUuid = getBetaTesterUuid(testerName)
	if (!tasks.names.contains("jarBeta${testerName}")) {
		File generatedMetaDir = layout.buildDirectory.dir("generated/beta/${testerName}/META-INF").get().asFile
		File betaDir = layout.buildDirectory.dir("generated/beta/${testerName}").get().asFile
		String modVersion = project.version.toString()
		String modGroup = "${project.group}.${testerName}".toString()

		tasks.register("jarBeta${testerName}", Jar) { jarTask ->
			jarTask.destinationDirectory = layout.buildDirectory.dir("libs/beta/${testerName}")
			jarTask.archiveBaseName = base.archivesName.get()
			jarTask.archiveVersion = project.jar.archiveVersion
			jarTask.from sourceSets.main.output

			jarTask.doFirst {
				File propFile = new File(generatedMetaDir, "mineraculous_beta.properties")
				propFile.parentFile.mkdirs()
				propFile.text = "tester=${testerName}\nuuid=${testerUuid}\nversion=${modVersion}\ngroup=${modGroup}\n"
			}
			jarTask.from(betaDir)

			jarTask.manifest {
				attributes([
						'Specification-Title'   : mod_name,
						'Specification-Vendor'  : mod_author,
						'Specification-Version' : project.jar.archiveVersion,
						'Implementation-Title'  : project.name,
						'Implementation-Version': project.jar.archiveVersion,
						'Implementation-Vendor' : mod_author,
						'Built-On-Minecraft'    : minecraft_version,
						'Beta-Tester'           : testerName,
						'Beta-Tester-UUID'      : testerUuid
				])
			}
		}
	}
}

publishing {
	def isBetaBuild = project.version.contains("beta")

	publications {
		if (isBetaBuild) {
			getBetaTesters().each { testerName ->
				registerBetaJar(testerName)

				register("mavenBeta${testerName}", MavenPublication) {
					groupId = "${project.group}.${testerName}"
					artifactId = base.archivesName.get()
					version = "${project.version}"
					from components.java

					artifacts.removeIf { it.classifier == null && (it.extension == 'jar' || (it.file != null && it.file.name.endsWith('.jar'))) }
					artifact(tasks.named("jarBeta${testerName}"))

					pom {
						name = project.mod_name
						description = project.description
						url = "https://github.com/thomasglasser/${github_name}/wiki"
						licenses {
							license {
								name = project.license
							}
						}
						developers {
							developer {
								id = project.mod_author
								name = project.mod_author
							}
						}
						issueManagement {
							system = 'GitHub'
							url = "https://github.com/thomasglasser/${github_name}/issues"
						}
						scm {
							connection = "scm:git:git://github.com/thomasglasser/${github_name}.git"
							developerConnection = "scm:git:ssh://github.com:thomasglasser/${github_name}.git"
							url = "https://github.com/thomasglasser/${github_name}/tree/${minecraft_version}"
						}
					}
				}
			}
		} else {
			register('mavenJava', MavenPublication) {
				artifactId = base.archivesName.get()
				from components.java

				pom {
					name = project.mod_name
					description = project.description
					url = "https://github.com/thomasglasser/${github_name}/wiki"
					licenses {
						license {
							name = project.license
						}
					}
					developers {
						developer {
							id = project.mod_author
							name = project.mod_author
						}
					}
					issueManagement {
						system = 'GitHub'
						url = "https://github.com/thomasglasser/${github_name}/issues"
					}
					scm {
						connection = "scm:git:git://github.com/thomasglasser/${github_name}.git"
						developerConnection = "scm:git:ssh://github.com:thomasglasser/${github_name}.git"
						url = "https://github.com/thomasglasser/${github_name}/tree/${minecraft_version}"
					}
				}
			}
		}
	}

	repositories {
		maven {
			name = "Reposilite"
			url = isBetaBuild ? "https://maven.thomasglasser.dev/betas" : "https://maven.thomasglasser.dev/releases"
			credentials {
				username = project.findProperty("REPOSILITE_USERNAME") ?: System.getenv("REPOSILITE_USERNAME")
				password = project.findProperty("REPOSILITE_PASSWORD") ?: System.getenv("REPOSILITE_PASSWORD")
			}
		}
	}
}

signing {
	useGpgCmd()
	sign publishing.publications.matching { it.name == 'mavenJava' }
}

def isBetaBuild = project.version.contains("beta")

// Disable Gradle Module Metadata for beta builds.
tasks.withType(GenerateModuleMetadata).configureEach {
	enabled = !isBetaBuild
}

// Only apply strict capabilities to the public stable release.
if (!isBetaBuild) {
	// Declare capabilities on the outgoing configurations.
	// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
	['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
		configurations."$variant".outgoing {
			capability("$group:${base.archivesName.get()}:$version")
			capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
			capability("$group:$mod_id:$version")
		}
		publishing.publications.configureEach {
			suppressPomMetadataWarningsFor(variant)
		}
	}
}

jar {
	manifest {
		attributes([
				'Specification-Title'   : mod_name,
				'Specification-Vendor'  : mod_author,
				'Specification-Version' : project.jar.archiveVersion,
				'Implementation-Title'  : project.name,
				'Implementation-Version': project.jar.archiveVersion,
				'Implementation-Vendor' : mod_author,
				'Built-On-Minecraft'    : minecraft_version
		])
	}
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
